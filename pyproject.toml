[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fastapi-ai-project"
version = "1.0.0"
description = "FastAPI backend for AI processing"
requires-python = ">=3.11"
authors = [
    {name = "AI Backend Team", email = "team@example.com"}
]
license = {text = "MIT"}

dependencies = [
    # Core FastAPI & Web Framework
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "gunicorn>=21.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    # Database & ORM
    "sqlmodel>=0.0.14",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.0",
    # Authentication & Security
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "argon2-cffi>=23.1.0",
    "python-multipart>=0.0.6",
    # Rate Limiting & Middleware
    "slowapi>=0.1.9",
    "redis>=5.0.0",
    # Task Queue
    "celery>=5.3.0",
    # HTTP & API Clients
    "httpx>=0.25.0",
    "requests>=2.31.0",
    # AI/ML Integration
    "openai>=1.3.0",
    "anthropic>=0.7.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "structlog>=23.2.0",
    "tenacity>=8.2.0",
    "email-validator>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.12.0",
    "isort>=5.13.0",
    "flake8>=6.1.0",
    "mypy>=1.7.0",
    "types-redis>=4.6.0",
    "types-requests>=2.31.0",
]

[tool.setuptools]
packages = ["src.app"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
