---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: ai-backend

---
# ConfigMap for non-sensitive configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-backend-config
  namespace: ai-backend
data:
  DEBUG: "false"
  APP_NAME: "AI Backend Project"
  RATE_LIMIT_ENABLED: "true"
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  REFRESH_TOKEN_EXPIRE_DAYS: "7"
  ALGORITHM: "HS256"

---
# Secrets (base64 encoded - replace with actual values)
apiVersion: v1
kind: Secret
metadata:
  name: ai-backend-secrets
  namespace: ai-backend
type: Opaque
data:
  # Replace these with base64-encoded actual values
  # Generate with: echo -n "value" | base64
  database-url: cG9zdGdyZXM6Ly91c2VyOnBhc3NAcG9zdGdyZXM6NTQ0MC9haV9iYWNrZW5k
  redis-url: cmVkaXM6Ly9yZWRpczo2Mzg3LzA=
  celery-broker-url: cmVkaXM6Ly9yZWRpczo2Mzg3LzI=
  celery-result-backend: cmVkaXM6Ly9yZWRpczo2Mzg3LzM=
  secret-key: eW91ci1zZWNyZXQta2V5LWNoYW5nZS1pbi1wcm9kdWN0aW9u
  openai-api-key: eW91ci1vcGVuYWktYXBpLWtleQ==

---
# Ingress Controller (Nginx)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-backend-ingress
  namespace: ai-backend
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - api.example.com
    secretName: ai-backend-tls
  rules:
  - host: api.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ai-backend-api
            port:
              number: 8008

---
# Network Policy for security
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ai-backend-network-policy
  namespace: ai-backend
spec:
  podSelector:
    matchLabels:
      app: ai-backend
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8008
  - from:
    - podSelector:
        matchLabels:
          app: ai-backend
    ports:
    - protocol: TCP
      port: 8008
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: ai-backend
    ports:
    - protocol: TCP
      port: 5432
    - protocol: TCP
      port: 6379
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53

---
# Pod Disruption Budget for high availability
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ai-backend-api-pdb
  namespace: ai-backend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ai-backend
      component: api

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ai-backend-celery-worker-pdb
  namespace: ai-backend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ai-backend
      component: celery-worker
